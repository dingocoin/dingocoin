# CodeQL GH Actions file
name: CodeQL

on:
  push:
    branches:
      - '*-dev'
      - '*-maint'
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - '*-dev'
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'contrib/**'
      - 'doc/**'
      - 'share/**'
      - 'qa/**'

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-20.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update system
      run: |
        printf '%s\n' \
          'Acquire::Retries "5";' \
          'Acquire::http::Timeout "120";' \
          'Acquire::https::Timeout "120";' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-retries >/dev/null
        for attempt in 1 2 3 4 5; do
          if sudo apt-get update -y; then
            break
          fi
          echo "apt-get update failed (attempt ${attempt}/5), retrying in 20s..."
          if [ "$attempt" -eq 5 ]; then exit 1; fi
          sleep 20
        done
        sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils

    - name: Dependency cache
      uses: actions/cache@v4
      env:
        cache-name: depends
      with:
        path: ./depends/built
        key: codeql-${{ env.cache-name }}-${{ hashFiles('depends/packages/*') }}

    - name: Build depends
      run: |
        pushd depends
        make -j4 HOST=x86_64-pc-linux-gnu
        popd

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Build Dingocoin
      run: |
       ./autogen.sh
       ./configure --prefix=`pwd`/depends/x86_64-pc-linux-gnu
       make -j4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
